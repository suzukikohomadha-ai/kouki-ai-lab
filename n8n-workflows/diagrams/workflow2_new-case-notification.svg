<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 260" font-family="'Hiragino Sans','Yu Gothic',Meiryo,sans-serif">
  <rect x="0" y="0" width="1080" height="260" fill="#ffffff"/>
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <text x="20" y="32" font-size="22" font-weight="700" fill="#0f172a">ワークフロー④：新規案件登録 → 関係者への自動通知</text>
  <text x="20" y="58" font-size="15" fill="#475569">🟦 自動で行われるステップ　　🟩 担当者にとって追加作業が増えないステップ</text>

  <!-- Box1 -->
  <rect x="30" y="100" width="260" height="120" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="160" y="132" font-size="14" fill="#1e40af" text-anchor="middle" font-weight="700">① きっかけ</text>
  <text x="160" y="158" font-size="14" fill="#1e293b" text-anchor="middle">新しい案件が</text>
  <text x="160" y="178" font-size="14" fill="#1e293b" text-anchor="middle">システムに登録される</text>

  <line x1="290" y1="160" x2="360" y2="160" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow2)"/>

  <!-- Box2 -->
  <rect x="360" y="90" width="300" height="140" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="510" y="122" font-size="14" fill="#1e40af" text-anchor="middle" font-weight="700">② 自動で連絡</text>
  <text x="510" y="148" font-size="13.5" fill="#1e293b" text-anchor="middle">検査担当者とマネージャーへ</text>
  <text x="510" y="168" font-size="13.5" fill="#1e293b" text-anchor="middle">お知らせメールが</text>
  <text x="510" y="188" font-size="13.5" fill="#1e293b" text-anchor="middle">自動で届く</text>

  <line x1="660" y1="160" x2="720" y2="160" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow2)"/>

  <!-- Box3 -->
  <rect x="720" y="100" width="330" height="120" rx="16" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/>
  <text x="885" y="132" font-size="14" fill="#065f46" text-anchor="middle" font-weight="700">③ 担当者は見るだけ</text>
  <text x="885" y="158" font-size="13.5" fill="#1e293b" text-anchor="middle">普段どおりメールを確認するだけで、</text>
  <text x="885" y="178" font-size="13.5" fill="#1e293b" text-anchor="middle">新しく覚える作業は増えない</text>

  <text x="20" y="250" font-size="12.5" fill="#94a3b8">※ 実際の登録画面・データはダミーです（本番未接続）</text>
</svg>
