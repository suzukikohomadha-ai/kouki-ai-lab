<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>森のパン香房 チラシ（デモ・架空案件）</title>
<style>
  /* [仮定] ブランドトークン未確定のため、このデモ限定の暫定配色を使用 */
  :root {
    --beige: #f3ead9;
    --brown: #6b4a2f;
    --brown-d: #4a3220;
    --green: #4a6b4f;
    --text: #3a2f22;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #ddd; font-family: "Hiragino Sans", "Yu Gothic", sans-serif; }
  .sheet {
    width: 210mm; height: 297mm; margin: 20px auto; background: var(--beige);
    padding: 16mm; position: relative; overflow: hidden;
  }
  .badge { position: absolute; top: 10mm; right: 10mm; background: var(--brown-d); color: #fff;
    font-size: 11px; padding: 4px 10px; border-radius: 999px; }
  h1 { color: var(--brown-d); font-size: 40px; margin: 40px 0 4px; line-height: 1.3; }
  .sub { color: var(--green); font-size: 16px; margin: 0 0 24px; font-weight: bold; }
  .hero {
    height: 90mm; background: repeating-linear-gradient(135deg, var(--brown) 0 18px, #7d5a3c 18px 36px);
    border-radius: 12px; display: flex; align-items: center; justify-content: center;
    color: #fff8ec; font-size: 14px; opacity: .85;
  }
  .lead { font-size: 15px; line-height: 1.9; color: var(--text); margin: 20px 0; }
  .info { display: flex; gap: 16px; margin-top: 20px; }
  .card { flex: 1; background: #fff; border: 1px solid #e3d6bf; border-radius: 10px; padding: 14px 16px; }
  .card b { display: block; color: var(--brown-d); font-size: 13px; margin-bottom: 6px; }
  .cta { margin-top: 24px; text-align: center; }
  .cta a { display: inline-block; background: var(--green); color: #fff; padding: 12px 28px;
    border-radius: 999px; text-decoration: none; font-weight: bold; }
  footer { position: absolute; bottom: 12mm; left: 16mm; right: 16mm; font-size: 11px; color: #8a7a63; text-align: center; }
</style>
</head>
<body>
  <div class="sheet">
    <span class="badge">DEMO（架空案件・外部未公開）</span>
    <h1>近所に、もう一つの<br>落ち着ける場所。</h1>
    <p class="sub">季節限定パン、はじまりました。</p>
    <div class="hero">〔ここに焼きたてパンの写真が入ります／画像素材は未接続のためプレースホルダー〕</div>
    <p class="lead">
      在宅ワークの合間や、ちょっとした休憩に。森のパン香房は、焼きたてパンとコーヒーで
      ゆっくり過ごせるイートインスペースをご用意しています。
    </p>
    <div class="info">
      <div class="card"><b>営業時間</b>8:00〜18:00（架空の設定です）</div>
      <div class="card"><b>Instagram</b>@mori_no_pan_demo（架空アカウント）</div>
    </div>
    <div class="cta"><a href="#">季節限定パンをチェック</a></div>
    <footer>※これはデモ用の架空チラシです。実在の店舗・商品ではありません。</footer>
  </div>
</body>
</html>
