<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="common.css"><style>.steps{grid-template-columns:repeat(4,1fr)}.st{position:relative;text-align:center}.num{width:56px;height:56px;border-radius:50%;background:var(--gold);color:var(--navy);font-size:30px;font-weight:bold;display:flex;align-items:center;justify-content:center;margin:0 auto 12px}.st .ttl{font-size:25px}.st .txt{font-size:20px}.chk{margin-top:26px;display:grid;grid-template-columns:260px 1fr;gap:20px;align-items:center}.chk ul{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:10px 24px}.chk li{font-size:22px}.chk li::before{content:"✓ ";color:var(--green);font-weight:bold}</style></head><body><div class="canvas">
<span class="kicker">CONTACT</span>
<h1>ご相談の流れ</h1>
<p class="sub">まずはお気軽にコホマダへお問い合わせください</p>
<div class="grid steps">
 <div class="card st"><div class="num">1</div><div class="ttl">お問い合わせ</div><div class="txt">コホマダの窓口へ<br>ご連絡ください</div></div>
 <div class="card st"><div class="num">2</div><div class="ttl">ヒアリング</div><div class="txt">ご用途・数量など<br>を伺います</div></div>
 <div class="card st"><div class="num">3</div><div class="ttl">おつなぎ</div><div class="txt">Cupffee社を<br>ご紹介します</div></div>
 <div class="card st"><div class="num">4</div><div class="ttl">Cupffee社と直接</div><div class="txt">価格・ロット・仕様は<br>Cupffee社とご相談</div></div>
</div>
<div class="card chk">
 <div class="ttl" style="margin:0">お問い合わせ時に<br>お知らせください</div>
 <ul><li>業種・会社名</li><li>使いたい場面</li><li>想定数量・サイズ</li><li>ロゴ入りのご希望※</li><li>導入したい時期</li></ul>
</div>
<div class="foot"><span>※ロゴ入り仕様はCupffee社の条件により提供されない場合があります。コホマダは販売代理店ではありません</span><b>KOHOMADA</b></div>
</div></body></html>
